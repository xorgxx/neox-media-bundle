# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Neox\MediaBundle\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Attribute/'
            - '../src/Metadata/MediaFieldDefinition.php'
            - '../src/DependencyInjection/'
            - '../src/NeoxMediaBundle.php'

    Neox\MediaBundle\Service\UploadValidator:
        arguments:
            $maxSizes: '%neox_media.upload.max_sizes%'
            $allowedMime: '%neox_media.upload.allowed_mime%'
            $allowedExtensions: '%neox_media.upload.allowed_extensions%'
            $sandboxEnabled: '%neox_media.upload.sandbox.enabled%'
            $sandboxMime: '%neox_media.upload.sandbox.mime%'
            $sandboxExtensions: '%neox_media.upload.sandbox.extensions%'

    Neox\MediaBundle\Service\UrlValidator:
        arguments:
            $allowedSchemes: '%neox_media.url.allowed_schemes%'
            $allowedEmbedProviders: '%neox_media.embed.allowed_providers%'

    Neox\MediaBundle\MessageHandler\ProcessMediaMessageHandler:
        arguments:
            $processors: !tagged_iterator neox_media.processor

    Neox\MediaBundle\Storage\FilesystemStorageAdapter:
        arguments:
            $cdnPrefix: '%neox_media.storage.cdn_prefix%'
            $projectDir: '%kernel.project_dir%'

    Neox\MediaBundle\Service\MediaUrlGenerator:
        arguments:
            $storage: '@Neox\MediaBundle\Storage\FilesystemStorageAdapter'

    Neox\MediaBundle\Embed\EmbedProviderRegistry:
        arguments:
            $providers: !tagged_iterator neox_media.embed_provider

    # --- Ownership / sharing -------------------------------------------------
    # MediaOwnerProviderInterface alias is set by NeoxMediaExtension:
    # config provider > SecurityMediaOwnerProvider > NullMediaOwnerProvider.
    Neox\MediaBundle\Security\MediaVoter:
        arguments:
            $ownershipEnabled: '%neox_media.ownership.enabled%'
            $adminBypassRole: '%neox_media.ownership.admin_bypass_role%'
            $ownerProvider: '@Neox\MediaBundle\Ownership\MediaOwnerProviderInterface'

    # --- Smart folders -------------------------------------------------------
    Neox\MediaBundle\Folder\FolderRuleEvaluator:
        arguments:
            $allowedFields: '%neox_media.folders.rules.allowed_fields%'

    Neox\MediaBundle\Repository\MediaRepository:
        arguments:
            $ruleEvaluator: '@Neox\MediaBundle\Folder\FolderRuleEvaluator'

    # --- Controllers ----------------------------------------------------------
    Neox\MediaBundle\Controller\MediaUploadController:
        arguments:
            $ownerProvider: '@Neox\MediaBundle\Ownership\MediaOwnerProviderInterface'
            $accessRole: '%neox_media.security.access_role%'
            $defaultVisibility: '%neox_media.ownership.default_visibility%'

    Neox\MediaBundle\Controller\MediaManagerController:
        arguments:
            $ownerProvider: '@Neox\MediaBundle\Ownership\MediaOwnerProviderInterface'
            $accessRole: '%neox_media.security.access_role%'
            $ownershipEnabled: '%neox_media.ownership.enabled%'
            $foldersMaxDepth: '%neox_media.folders.max_depth%'

    Vich\UploaderBundle\Templating\Helper\UploaderHelperInterface: '@Vich\UploaderBundle\Templating\Helper\UploaderHelper'
    Neox\MediaBundle\Routing\MediaRoutesCondition:
        arguments:
            $routesEnabled: '%neox_media.routes.enabled%'
